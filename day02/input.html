<!DOCTYPE html>
<html lang="ko">
     <head>
       <meta charset="UTF-8" />
       <title>input</title>
       <!-- 내부스타일 -->
        <style>
          input[type="email"] {
            background-color: blue;
            color: #fff;
          }
        </style>
     </head>
     <body>
        <h1>Input 실습</h1>
        <form action="/signup" method="get">
          <label for="userid">아이디</label>
          <input
            type="text"
            id="userid"
            name="userid"
            placeholder="영문과 숫자 4자 이상"
          />
          <button type="submit">가입</button>
        </form>
     </body>
</html>
